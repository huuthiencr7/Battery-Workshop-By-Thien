<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Workshop - ThienCR7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="min-h-screen">

    <div id="home-view" class="active-view container mx-auto px-4 py-20 text-center relative">
        <h1 class="title-main uppercase tracking-wider mb-4">Battery Workshop</h1>
        <p class="sub-desc mb-12 italic">Đóng pin dự phòng, Đóng pin máy công cụ, Làm loa Karaoke theo yêu cầu, Sửa chữa đồ điện tử</p>
        
        <!-- Đã chỉnh sửa grid: grid-cols-2 trên mobile và grid-cols-4 trên desktop -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto">
            
            <button onclick="openCategory('du-phong', 'Pin Dự Phòng')" class="btn-du-phong h-24 rounded-2xl shadow-2xl transition-all transform hover:scale-105 border border-gray-700 flex flex-col justify-center items-center gap-1 z-10">
                <span class="btn-text">🔋 Pin Dự Phòng</span>
            </button>
            
            <button onclick="openCategory('may-cong-cu', 'Pin Máy Công Cụ')" class="btn-may-cong-cu h-24 rounded-2xl shadow-2xl transition-all transform hover:scale-105 border border-gray-700 flex flex-col justify-center items-center gap-1 z-10">
                <span class="btn-text">🛠️ Pin Máy Công Cụ</span>
            </button>
            
            <button onclick="openCategory('Acquy-Xe-May', 'Acquy Xe Máy')" class="btn-Acquy-Xe-May h-24 rounded-2xl shadow-2xl transition-all transform hover:scale-105 border border-gray-700 flex flex-col justify-center items-center gap-1 z-10">
                <span class="btn-text">⚡ Acquy Xe Máy</span>
            </button>

            <button onclick="openCategory('luu-tru', 'Pin Cho Lưu Trữ')" class="btn-luu-tru h-24 rounded-2xl shadow-2xl transition-all transform hover:scale-105 border border-gray-700 flex flex-col justify-center items-center gap-1 z-10">
                <span class="btn-text"> ⚙️Pin Cho Lưu Trữ & Thiết bị điện tử</span>
            </button>

            <!-- Nút mới: DIY Loa -->
            <button onclick="openCategory('DIY-Loa', 'DIY Loa')" class="btn-diy-loa h-24 rounded-2xl shadow-2xl transition-all transform hover:scale-105 border border-gray-700 flex flex-col justify-center items-center gap-1 z-10">
                <span class="btn-text">🎵 DIY Loa</span>
            </button>
                     
            <button onclick="openCategory('video', 'Video tham khảo')" class="btn-video h-24 rounded-2xl shadow-2xl transition-all transform hover:scale-105 border border-gray-700 flex flex-col justify-center items-center gap-1 z-10">
                <span class="btn-text">📺 Video tham khảo</span>
            </button>
        </div>

        <div class="fixed bottom-4 left-0 w-full text-center py-2 z-10">
            <p class="footer-text">---- Liên hệ Nguyễn Hữu Thiện để được tư vấn nhé ----</p>
        </div>
    </div>

    <!-- Category View -->
    <div id="category-view" class="hidden-view container mx-auto px-4 py-10">
        <div class="flex items-center justify-between mb-10 border-b border-gray-700 pb-6">
            <h2 id="category-title" class="text-3xl font-bold text-highlight">Tên danh mục</h2>
            <button onclick="goHome()" class="bg-btn-custom hover:bg-gray-600 px-5 py-2 rounded-lg transition">⬅ Back về trang chủ</button>
        </div>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>

    <!-- Modal -->
    <div id="product-modal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4">
        <div class="bg-card p-6 rounded-2xl max-w-2xl w-full relative border border-gray-700">
            <div class="flex justify-end mb-2">
                <button onclick="closeModal()" class="text-3xl text-gray-700 hover:text-white p-2">
                    &times;
                </button>
            </div>
            <div id="modal-content" class="overflow-y-auto max-h-[70vh]"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="main.js"></script>
    <!-- Nút Home nổi góc dưới bên phải -->
<a href="index.html" id="floatingHomeBtn" class="fixed bottom-6 right-6 z-50 bg-blue-600 text-white p-3.5 rounded-full shadow-lg hover:bg-blue-700 transition-all duration-300 flex items-center justify-center group" title="Về trang chủ">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
    </svg>
</a>
<script>
    const floatingBtn = document.getElementById('floatingHomeBtn');
    
    // Ẩn nút đi lúc ban đầu khi ở đầu trang
    floatingBtn.style.opacity = '0';
    floatingBtn.style.visibility = 'hidden';
    floatingBtn.style.transition = 'all 0.3s ease';

    window.addEventListener('scroll', function () {
        if (window.scrollY > 150) {
            // Khi cuộn xuống quá 200px thì hiện nút lên
            floatingBtn.style.opacity = '1';
            floatingBtn.style.visibility = 'visible';
        } else {
            // Khi ở gần đầu trang thì ẩn nút đi
            floatingBtn.style.opacity = '0';
            floatingBtn.style.visibility = 'hidden';
        }
    });
</script>
</body>
</html>
